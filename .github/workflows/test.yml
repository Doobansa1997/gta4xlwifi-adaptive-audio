name: Host tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential erofs-utils zlib1g-dev
      - name: Verify source dependencies
        run: python3 tools/fetch_sources.py
      - name: Build native test tool
        run: python3 tools/build_tools.py --host-only
      - name: Run firmware-free tests
        run: python3 -m unittest discover -s tests -v
